[package]
name = "expense-lens"
version = "0.2.0"
description = "Local-first personal expense analysis"
edition = "2021"

[lib]
name = "expense_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled", "backup", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

# The VS 2026 toolset and cc-rs currently fail with D8050 when /Z7 is emitted
# while compiling bundled SQLite. SQLite's C debug symbols are not needed for
# the app's dev build, so keep them off for this dependency only.
[profile.dev.package.libsqlite3-sys]
debug = 0
